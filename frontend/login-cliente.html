<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinSight — Login Exclusivo do Cliente</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/accessibility.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style id="finsight-fast-btn">
form button[type="submit"], #btn-entrar-cliente, button.btn-primary {
    display: block !important;
    width: 100% !important;
    opacity: 1 !important;
    visibility: visible !important;
    background: #0b5ed7 !important;
    color: #ffffff !important;
    border: 1px solid #0b5ed7 !important;
    border-radius: 8px !important;
    padding: 12px 16px !important;
    font-weight: 600 !important;
    cursor: pointer !important;
    margin-top: 14px !important;
    transition: none !important;
}
</style>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%2300d2ff%27 stroke-width=%272.4%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M3 3v18h18%27/%3E%3Cpath d=%27m7 15 4-4 3 3 5-6%27/%3E%3C/svg%3E">
</head>
<body class="a11y-font-normal">
    <div id="auth-screen" class="auth-container" style="display:flex;">
        <div class="auth-card">
            <div class="auth-header">
                <div class="brand-logo"><i class="fa-solid fa-user-check"></i> FinSight</div>
                <p>Portal do Cliente — Histórico de Compras e Pagamentos</p>
                <div class="a11y-toolbar" style="justify-content:center; margin-top:12px;">
                    <button type="button" class="a11y-btn" onclick="changeFontSize(-1)" title="Diminuir fonte">A-</button>
                    <button type="button" class="a11y-btn" onclick="changeFontSize(0)" title="Tamanho padrão">A</button>
                    <button type="button" class="a11y-btn" onclick="changeFontSize(1)" title="Aumentar fonte">A+</button>
                    <button type="button" class="a11y-btn" id="btn-contrast" onclick="toggleContrast()" title="Alternar alto contraste">
                        <i class="fa-solid fa-circle-half-stroke"></i> Contraste
                    </button>
                </div>
            </div>

            <form id="cliente-login-form" onsubmit="handleClienteLogin(event)">
                <div class="input-group">
                    <label for="cli-login-empresa">Empresa</label>
                    <select id="cli-login-empresa" required>
                        <option value="1">Matriz Comercial Ltda</option>
                        <option value="2">Distribuidora Bahia Sul</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="cli-login-usuario">Usuário ou E-mail do Cliente</label>
                    <input type="text" id="cli-login-usuario" required placeholder="Ex: mariana.costa ou email">
                </div>

                <div class="input-group">
                    <label for="cli-login-senha">Senha</label>
                    <input type="password" id="cli-login-senha" required placeholder="Digite sua senha">
                </div>

                <p id="cli-login-erro" style="display:none; color:#DC2626; font-size:0.875rem; margin-bottom:12px; font-weight:600;"></p>

                <button type="submit" class="btn-primary">Entrar na Minha Área</button>
            </form>

            <div style="margin-top:16px; text-align:center; font-size:0.875rem;">
                <a href="index.html" style="color:var(--primary-blue); text-decoration:none; font-weight:600;">
                    <i class="fa-solid fa-arrow-left"></i> Voltar ao acesso da equipe
                </a>
            </div>
        </div>
    </div>

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        if (window.VLibras) {
            new window.VLibras.Widget('https://vlibras.gov.br/app');
        }
    </script>
    <script src="js/accessibility.js"></script>
    <script src="js/state.js"></script>
<script src="js/seed-clientes.js"></script>
    <script src="js/cliente-login.js"></script>
<script src="js/seed-clientes-gmail.js"></script>
<script src="js/fix-botao-visivel.js"></script>
<script src="js/logo-finsight.js"></script>
<script src="js/alto-contraste-cliente.js"></script>
<script src="js/tamanho-fonte-cliente.js"></script>
</body>
</html>
