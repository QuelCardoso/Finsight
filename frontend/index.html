<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinSight — Gestão Inteligente para o seu Negócio</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/accessibility.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style id="finsight-fast-btn">
form button[type="submit"], #btn-entrar-cliente, button.btn-primary {
    display: block !important;
    width: 100% !important;
    opacity: 1 !important;
    visibility: visible !important;
    background: #0b5ed7 !important;
    color: #ffffff !important;
    border: 1px solid #0b5ed7 !important;
    border-radius: 8px !important;
    padding: 12px 16px !important;
    font-weight: 600 !important;
    cursor: pointer !important;
    margin-top: 14px !important;
    transition: none !important;
}
</style>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%2300d2ff%27 stroke-width=%272.4%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M3 3v18h18%27/%3E%3Cpath d=%27m7 15 4-4 3 3 5-6%27/%3E%3C/svg%3E">
</head>
<body>

    <div id="auth-screen" class="auth-container">
        <div class="auth-card">
            <div style="display:flex; justify-content:flex-end; margin-bottom:10px;">
                <div class="a11y-toolbar" role="group" aria-label="Controles de acessibilidade">
                    <button type="button" class="a11y-btn" onclick="diminuirFonte()" title="Diminuir tamanho da letra" aria-label="Diminuir letra">A-</button>
                    <button type="button" class="a11y-btn" onclick="resetarFonte()" title="Tamanho padrão da letra" aria-label="Letra padrão">A</button>
                    <button type="button" class="a11y-btn" onclick="aumentarFonte()" title="Aumentar tamanho da letra" aria-label="Aumentar letra">A+</button>
                    <button type="button" class="a11y-btn" onclick="alternarAltoContraste()" title="Alternar Alto Contraste" aria-label="Alto Contraste">
                        <i class="fa-solid fa-circle-half-stroke"></i>
                    </button>
                </div>
            </div>
            <div class="auth-logo">
                <i class="fa-solid fa-chart-line"></i>
                <h1>FinSight</h1>
                <p>Gestão inteligente para o seu negócio</p>
            </div>
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="empresa-select"><i class="fa-solid fa-building"></i> Selecionar Empresa</label>
                    <select id="empresa-select" required>
                        <option value="1">Matriz Comercial Ltda</option>
                        <option value="2">Distribuidora Bahia Sul</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="usuario"><i class="fa-solid fa-envelope"></i> E-mail ou Usuário</label>
                    <input type="text" id="usuario" placeholder="ex: admin@finsight.com" required value="admin@finsight.com">
                </div>
                <div class="input-group">
                    <label for="senha"><i class="fa-solid fa-lock"></i> Senha</label>
                    <input type="password" id="senha" placeholder="••••••••" required value="FinSight@2026">
                </div>
                <button type="submit" class="btn-primary">Entrar no Sistema</button>
            </form>
            <div style="margin-top:14px; text-align:center; font-size:0.875rem;">
                <a href="login-cliente.html" onclick="event.preventDefault(); sessionStorage.removeItem('finsight_modo_cliente_exclusivo'); window.location.href='login-cliente.html';">
                    <i class="fa-solid fa-user-lock"></i> Login exclusivo do cliente
                </a>
            </div>
        </div>
    </div>

    <div id="app-screen" class="app-layout" style="display: none;">
        <aside class="sidebar" aria-label="Menu principal">
            <div class="sidebar-brand">
                <i class="fa-solid fa-chart-line"></i>
                <span>FinSight</span>
            </div>
            <nav class="sidebar-nav">
                <a href="#" onclick="switchModule('dashboard')" class="nav-item active"><i class="fa-solid fa-house"></i> Dashboard</a>
                <a href="#" onclick="switchModule('clientes')" class="nav-item"><i class="fa-solid fa-users"></i> Clientes</a>
                <a href="#" onclick="switchModule('funcionarios')" class="nav-item"><i class="fa-solid fa-user-tie"></i> Funcionários</a>
                <a href="#" onclick="switchModule('estoque')" class="nav-item"><i class="fa-solid fa-boxes-stacked"></i> Estoque</a>
                <a href="#" onclick="switchModule('financeiro')" class="nav-item"><i class="fa-solid fa-wallet"></i> Financeiro</a>
                <a href="#" onclick="switchModule('inadimplencia')" class="nav-item"><i class="fa-solid fa-triangle-exclamation"></i> Inadimplência</a>
                <a href="#" onclick="event.preventDefault(); handleLogout();" class="nav-item logout" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();handleLogout();}"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="topbar-title">
                    <h2 id="current-module-title">Visão Geral</h2>
                </div>
                <div class="topbar-controls">
                    <div class="a11y-toolbar" role="group" aria-label="Controles de acessibilidade">
                        <button type="button" class="a11y-btn" onclick="diminuirFonte()" title="Diminuir tamanho da letra" aria-label="Diminuir letra">A-</button>
                        <button type="button" class="a11y-btn" onclick="resetarFonte()" title="Tamanho padrão da letra" aria-label="Letra padrão">A</button>
                        <button type="button" class="a11y-btn" onclick="aumentarFonte()" title="Aumentar tamanho da letra" aria-label="Aumentar letra">A+</button>
                        <button type="button" class="a11y-btn" onclick="alternarAltoContraste()" title="Alternar Alto Contraste" aria-label="Alto Contraste">
                            <i class="fa-solid fa-circle-half-stroke"></i> Contraste
                        </button>
                    </div>
                    <div class="topbar-user">
                        <span id="empresa-logada-badge">Matriz Comercial Ltda</span>
                        <i class="fa-solid fa-circle-user"></i>
                    </div>
                </div>
            </header>

            <div id="module-container" class="content-body"></div>
        </main>
    </div>

    <!-- Widget Oficial VLibras -->
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>

    <script src="js/accessibility.js"></script>
    <script src="js/state.js"></script>
<script src="js/seed-clientes.js"></script>
    <script src="js/modules/clientesMod.js"></script>
    <script src="js/modules/estoqueMod.js"></script>
    <script src="js/modules/funcionariosMod.js"></script>
    <script src="js/modules/financeiroMod.js"></script>
    <script src="js/modules/inadimplenciaMod.js"></script>
    <script src="js/seed-funcionarios.js"></script>
<script src="js/seed-estoque.js"></script>
<script src="js/perfis-colaborador.js"></script>
<script src="js/app.js"></script>
<script src="js/cliente-exclusivo.js"></script>
<script src="js/seed-clientes-gmail.js"></script>
<script src="js/fallback-visao-geral.js"></script>
<script src="js/logo-finsight.js"></script>
</body>
</html>
